
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnHub - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-primary navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            LearnHub
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="courses.html">Courses</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="contact.html">Contact</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="login.html">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- REGISTER FORM -->
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

            <div class="card shadow border-0">
                <div class="card-body p-4 p-md-5">

                    <h2 class="text-center fw-bold mb-2">
                        Create Your Account
                    </h2>

                    <p class="text-center text-muted mb-4">
                        Join LearnHub and start learning today.
                    </p>

                    <div id="message"></div>

                    <form id="registerForm">

                        <div class="mb-3">
                            <label for="fullName" class="form-label">
                                Full Name
                            </label>
                            <input type="text" class="form-control"
                                   id="fullName" required
                                   placeholder="Enter your full name">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email Address
                            </label>
                            <input type="email" class="form-control"
                                   id="email" required
                                   placeholder="Enter your email">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>
                            <input type="password" class="form-control"
                                   id="password" required minlength="6"
                                   placeholder="At least 6 characters">
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">
                                Confirm Password
                            </label>
                            <input type="password" class="form-control"
                                   id="confirmPassword" required
                                   placeholder="Enter password again">
                        </div>

                        <div class="mb-3">
                            <label for="role" class="form-label">
                                Register As
                            </label>
                            <select class="form-select" id="role" required>
                                <option value="">Select your role</option>
                                <option value="Student">Student</option>
                                <option value="Instructor">Instructor</option>
                            </select>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input"
                                   type="checkbox" id="terms" required>
                            <label class="form-check-label" for="terms">
                                I agree to the Terms and Conditions
                            </label>
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100">
                            Create Account
                        </button>

                    </form>

                    <p class="text-center mt-4 mb-0">
                        Already have an account?
                        <a href="login.html">Login</a>
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-4">
    <div class="container">
        <p class="mb-1">© 2026 LearnHub. All Rights Reserved.</p>
        <small>Learn. Practice. Grow.</small>
    </div>
</footer>

<script>
document.getElementById("registerForm").addEventListener(
    "submit",
    function(event) {
        event.preventDefault();

        const name = document.getElementById("fullName").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const role = document.getElementById("role").value;
        const message = document.getElementById("message");

        message.innerHTML = "";

        if (password !== confirmPassword) {
            message.innerHTML =
                '<div class="alert alert-danger">Passwords do not match.</div>';
            return;
        }

        if (password.length < 6) {
            message.innerHTML =
                '<div class="alert alert-danger">Password must have at least 6 characters.</div>';
            return;
        }

        let users = JSON.parse(
            localStorage.getItem("learnhubUsers")
        ) || [];

        const existingUser = users.find(
            user => user.email === email
        );

        if (existingUser) {
            message.innerHTML =
                '<div class="alert alert-warning">This email is already registered. Please login.</div>';
            return;
        }

        // DEMO ONLY: Do not store real passwords this way.
        users.push({
            name: name,
            email: email,
            password: password,
            role: role
        });

        localStorage.setItem(
            "learnhubUsers",
            JSON.stringify(users)
        );

        message.innerHTML =
            '<div class="alert alert-success">Account created successfully! You can now login.</div>';

        document.getElementById("registerForm").reset();
    }
);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
