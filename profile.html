
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - LearnHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">LearnHub</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="courses.html">Courses</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="profile.html">Profile</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- PROFILE -->
<div class="container py-5">
    <div class="text-center mb-4">
        <h1 class="fw-bold">My Profile</h1>
        <p class="text-muted">View your LearnHub account details</p>
    </div>

    <div class="card shadow-sm mx-auto" style="max-width: 650px;">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <div class="rounded-circle bg-primary text-white
                            d-flex align-items-center justify-content-center
                            mx-auto mb-3"
                     style="width: 90px; height: 90px; font-size: 36px;">
                    👤
                </div>
                <h3 id="profileName">Student Name</h3>
                <span class="badge bg-primary" id="profileRole">Student</span>
            </div>

            <hr>

            <h5 class="mb-3">Personal Information</h5>

            <p><strong>Name:</strong> <span id="name"></span></p>
            <p><strong>Email:</strong> <span id="email"></span></p>
            <p><strong>Role:</strong> <span id="role"></span></p>

            <hr>

            <h5 class="mb-3">My Enrolled Courses</h5>
            <div id="courseList"></div>

            <div class="d-grid gap-2 mt-4">
                <a href="dashboard.html" class="btn btn-primary">
                    Go to Dashboard
                </a>
                <button class="btn btn-outline-danger" onclick="logout()">
                    Logout
                </button>
            </div>

        </div>
    </div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">© 2026 LearnHub. All rights reserved.</p>
</footer>

<script>
    // Get logged-in user
    const currentUser = JSON.parse(
        localStorage.getItem("learnhubCurrentUser")
    );

    // Check login
    if (!currentUser) {
        window.location.href = "login.html";
    } else {
        document.getElementById("profileName").textContent =
            currentUser.name;

        document.getElementById("name").textContent =
            currentUser.name;

        document.getElementById("email").textContent =
            currentUser.email;

        document.getElementById("role").textContent =
            currentUser.role;

        document.getElementById("profileRole").textContent =
            currentUser.role;
    }

    // Get enrolled courses
    const allEnrollments = JSON.parse(
        localStorage.getItem("learnhubEnrolledCourses")
    ) || [];

    const myCourses = allEnrollments.filter(course =>
        currentUser && course.email === currentUser.email
    );

    const courseList = document.getElementById("courseList");

    if (myCourses.length === 0) {
        courseList.innerHTML = `
            <p class="text-muted">
                You have not enrolled in any courses yet.
            </p>
            <a href="courses.html" class="btn btn-outline-primary btn-sm">
                Browse Courses
            </a>
        `;
    } else {
        myCourses.forEach(course => {
            const item = document.createElement("div");
            item.className = "border rounded p-3 mb-2";
            item.textContent = "📘 " + course.courseName;
            courseList.appendChild(item);
        });
    }

    // Logout
    function logout() {
        localStorage.removeItem("learnhubCurrentUser");
        window.location.href = "login.html";
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
