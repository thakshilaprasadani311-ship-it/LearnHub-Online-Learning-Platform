    body {
      background: #f4f7fb;
      font-family: Arial, sans-serif;
    }

    .lesson-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
    }

    .lesson-sidebar, .lesson-content, .progress-card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .lesson-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: white;
      color: #333;
    }

    .lesson-item.active {
      background: #eaf2ff;
      border-color: #0d6efd;
      color: #084298;
      font-weight: bold;
    }

    .lesson-item.completed {
      border-color: #198754;
    }

    .lesson-text {
      line-height: 1.8;
      font-size: 16px;
    }

    .lesson-text h3 {
      margin-top: 22px;
      font-size: 21px;
    }

    .lesson-text li {
      margin-bottom: 8px;
    }

    .code-example {
      background: #212529;
      color: #f8f9fa;
      padding: 16px;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-x: auto;
      font-family: Consolas, monospace;
    }

    .progress {
      height: 12px;
    }

    @media (max-width: 768px) {
      .lesson-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

// ====================================
// 2. GET COURSE AND USER
// ====================================

const params = new URLSearchParams(window.location.search);
const courseId = params.get("course") || "web";
const course = courseData[courseId];

function getCurrentUser() {
  try {
    return JSON.parse(
      localStorage.getItem("learnhubCurrentUser") || "null"
    );
  } catch (error) {
    return null;
  }
}

const currentUser = getCurrentUser();

const userEmail = currentUser && currentUser.email
  ? currentUser.email.toLowerCase()
  : "";


// ====================================
// 3. GET ENROLLMENT
// ====================================

function getAllEnrollments() {
  try {
    const data = JSON.parse(
      localStorage.getItem("learnhubEnrolledCourses") || "[]"
    );

    return Array.isArray(data) ? data : [];
  } catch (error) {
    return [];
  }
}

const allEnrollments = getAllEnrollments();

const enrolled = allEnrollments.some(item =>
  item.email &&
  item.email.toLowerCase() === userEmail &&
  item.courseId === courseId
);


// ====================================
// 4. PROGRESS SETTINGS
// ====================================

const progressKey = "learnhubProgress_" +
  encodeURIComponent(userEmail) + "_" + courseId;

let completedLessons = [];
let currentLesson = 0;


// Load progress safely
function loadProgress() {
  try {
    const saved = JSON.parse(
      localStorage.getItem(progressKey) || "[]"
    );

    return Array.isArray(saved) ? saved : [];
  } catch (error) {
    return [];
  }
}


// Remove invalid or duplicate lesson indexes
function cleanProgress() {
  const total = course.lessons.length;

  completedLessons = [...new Set(completedLessons)].filter(index =>
    Number.isInteger(index) &&
    index >= 0 &&
    index < total
  );

  completedLessons.sort((a, b) => a - b);
}


// Find next lesson not completed yet
function findNextIncompleteLesson() {
  for (let i = 0; i < course.lessons.length; i++) {
    if (!completedLessons.includes(i)) {
      return i;
    }
  }

  // If all lessons are complete, show the last lesson
  return course.lessons.length - 1;
}


// Save progress
function saveProgress() {
  localStorage.setItem(
    progressKey,
    JSON.stringify(completedLessons)
  );
}


// ====================================
// 5. MESSAGE
// ====================================

function showMessage(message, type = "danger") {
  const box = document.getElementById("message");

  box.className = "alert alert-" + type;
  box.textContent = message;
  box.classList.remove("d-none");
}


// ====================================
// 6. UPDATE COURSE PROGRESS
// ====================================

function updateProgress() {
  const total = course.lessons.length;
  const completed = completedLessons.length;

  const percentage = Math.round(
    (completed / total) * 100
  );

  document.getElementById("progressText").textContent =
    percentage + "%";

  document.getElementById("progressBar").style.width =
    percentage + "%";

  document.getElementById("lessonCount").textContent =
    completed + " of " + total + " lessons completed";
}


// ====================================
// 7. DISPLAY LESSON LIST
// ====================================

function renderLessonList() {
  const list = document.getElementById("lessonList");
  list.innerHTML = "";

  course.lessons.forEach((lesson, index) => {
    const button = document.createElement("button");
    button.className = "lesson-item";

    if (index === currentLesson) {
      button.classList.add("active");
    }

    if (completedLessons.includes(index)) {
      button.classList.add("completed");
    }

    const status =
      completedLessons.includes(index) ? " ✓" : "";

    button.textContent =
      (index + 1) + ". " + lesson.title + status;

    button.onclick = function() {
      currentLesson = index;
      renderLesson();
    };

    list.appendChild(button);
  });
}


// ====================================
// 8. DISPLAY CURRENT LESSON
// ====================================

function renderLesson() {
  const lesson = course.lessons[currentLesson];

  document.getElementById("lessonNumber").textContent =
    "Lesson " + (currentLesson + 1) +
    " of " + course.lessons.length;

  document.getElementById("lessonTitle").textContent =
    lesson.title;

  document.getElementById("lessonBody").innerHTML =
    lesson.content;

  const isCompleted =
    completedLessons.includes(currentLesson);

  document.getElementById("completionStatus").textContent =
    isCompleted ? "Completed ✓" : "Not completed";

  const completeBtn =
    document.getElementById("completeBtn");

  completeBtn.textContent = isCompleted
    ? "Completed ✓"
    : "Mark as Complete";

  completeBtn.disabled = isCompleted;

  document.getElementById("previousBtn").disabled =
    currentLesson === 0;

  document.getElementById("nextBtn").textContent =
    currentLesson === course.lessons.length - 1
      ? "Finish Course"
      : "Next Lesson →";

  renderLessonList();
  updateProgress();
}


// ====================================
// 9. MARK LESSON AS COMPLETE
// ====================================

function completeLesson() {
  if (!completedLessons.includes(currentLesson)) {
    completedLessons.push(currentLesson);

    cleanProgress();
    saveProgress();
  }

  renderLesson();

  if (completedLessons.length === course.lessons.length) {
    showMessage(
      "Congratulations! You completed this course.",
      "success"
    );
  } else {
    showMessage(
      "Lesson completed! Your progress has been saved.",
      "success"
    );
  }
}


// ====================================
// 10. NEXT LESSON
// ====================================

function nextLesson() {
  if (currentLesson < course.lessons.length - 1) {
    currentLesson++;
    renderLesson();
  } else if (
    completedLessons.length === course.lessons.length
  ) {
    showMessage(
      "You have completed all lessons in this course!",
      "success"
    );
  } else {
    showMessage(
      "Complete the remaining lessons to finish the course.",
      "warning"
    );
  }
}


// ====================================
// 11. PREVIOUS LESSON
// ====================================

function previousLesson() {
  if (currentLesson > 0) {
    currentLesson--;
    renderLesson();
  }
}


// ====================================
// 12. INITIALIZE PAGE
// ====================================

function initializePage() {

  // Check login
  if (!currentUser || !userEmail) {
    window.location.href = "login.html";
    return;
  }

  // Check course ID
  if (!course) {
    document.getElementById("courseName").textContent =
      "Course Not Found";

    showMessage(
      "This course could not be found. Please return to Courses."
    );
    return;
  }

  // Check enrollment
  if (!enrolled) {
    document.getElementById("courseName").textContent =
      "Enrollment Required";

    showMessage(
      "Please enroll in this course before starting lessons."
    );

    const link = document.createElement("a");
    link.href = "courses.html";
    link.className = "btn btn-primary";
    link.textContent = "Browse Courses";

    document.getElementById("message").appendChild(
      document.createElement("br")
    );

    document.getElementById("message").appendChild(link);
    return;
  }

  // Show course details
  document.getElementById("courseName").textContent =
    course.name;

  document.getElementById("courseDescription").textContent =
    course.description;

  // Load and clean saved progress
  completedLessons = loadProgress();
  cleanProgress();
  saveProgress();

  // Open first incomplete lesson automatically
  currentLesson = findNextIncompleteLesson();

  renderLesson();
}

initializePage();

</script>
